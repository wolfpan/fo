<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观览 · 般若藏</title>
  <link rel="stylesheet" href="/fonts/ma-shan-zheng/400.css">
  <link rel="stylesheet" href="/fonts/zhi-mang-xing/400.css">
  <link rel="stylesheet" href="/fonts/noto-serif-sc/400.css">
  <link rel="stylesheet" href="/fonts/noto-serif-sc/600.css">
  <link rel="stylesheet" href="/fonts/zcool-xiaowei/index.css">
  <link rel="stylesheet" href="/fonts/lxgw-wenkai/kai.css">
  <link rel="stylesheet" href="/css/style.css?v=7">
</head>
<body class="page-read">

  <div class="reader-progress" id="rprog"></div>

  <header class="reader-top">
    <a class="reader-back" href="/">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M10 3 L5 8 L10 13"/>
      </svg>
      般若藏
    </a>
    <div class="reader-title-sm" id="rtitle">…</div>
    <div class="reader-tools">
      <button class="tool-btn" id="btnToc" title="目录">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M3 4h10M3 8h10M3 12h6"/>
        </svg><span class="lab">目录</span>
      </button>
      <button class="tool-btn" id="btnVert" title="竖排阅读">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M4.5 2v12M11.5 2v12M3 4.5h3M10 7.5h3"/>
        </svg><span class="lab">竖排</span>
      </button>
      <button class="tool-btn" id="btnSize" title="字号"><span class="lab" style="font-family:var(--serif)">Aa</span></button>
    </div>
  </header>

  <div class="size-pop" id="sizePop">
    <button id="szDown" title="减小">−</button>
    <span class="val" id="szVal">22px</span>
    <button id="szUp" title="增大">＋</button>
  </div>

  <!-- 目录抽屉 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawerTitle">目录</h3>
      <span id="drawerCount"></span>
      <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
    </div>
    <nav class="drawer-list" id="tocList"></nav>
  </aside>

  <!-- 正文 -->
  <main class="reader-stage" id="stage">
    <div class="reader-paper" id="paper"></div>
  </main>

  <script src="/js/reader.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/font-toggle.js"></script>
</body>
</html>
